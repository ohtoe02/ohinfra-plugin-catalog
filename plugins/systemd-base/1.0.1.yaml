name: systemd-base
description: Systemd service status, logs, and controlled restart operations for ohtools.
homepage: https://github.com/ohtoe02/ohtools-plugins
version:
  version: 1.0.1
  minimum_ohtools_version: 0.3.1
  published_at: 2026-07-25T04:35:21Z
  yanked: false
  manifest:
    protocol_version: 1
    name: systemd-base
    version: 1.0.1
    description: Systemd service status, logs, and controlled restart operations for ohtools.
    commands:
      - path: [service, status]
        use: status <unit>
        short: Show stable systemd unit properties
        category: diagnostic
        arguments:
          - name: unit
            description: Systemd unit name
            required: true
            variadic: false
        flags: []
        requires_root: false
        requires_force: false
        supports_dry_run: false
        requires_confirmation: false
      - path: [service, logs]
        use: logs <unit>
        short: Show redacted systemd journal entries
        category: diagnostic
        arguments:
          - name: unit
            description: Systemd unit name
            required: true
            variadic: false
        flags:
          - name: since
            type: duration
            description: Journal lookback duration
            default: 1h0m0s
          - name: lines
            type: int
            description: Maximum journal lines
            default: 200
        requires_root: false
        requires_force: false
        supports_dry_run: false
        requires_confirmation: false
      - path: [service, restart]
        use: restart <unit>
        short: Restart and verify a systemd unit
        category: operational
        arguments:
          - name: unit
            description: Systemd unit name
            required: true
            variadic: false
        flags: []
        requires_root: true
        requires_force: false
        supports_dry_run: true
        requires_confirmation: true
  assets:
    - os: linux
      arch: amd64
      url: https://github.com/ohtoe02/ohtools-plugins/releases/download/systemd-base-v1.0.1/systemd-base_linux_amd64
      sha256: 31686be4461d13b14faa086401aeaea28c013042de21dfa593bd3a95f14c3fee
      size_bytes: 3215522
